name: Session5 Claude Test Report

on:
  workflow_dispatch:
    inputs:
      testcase:
        description: 'Ten test case'
        required: false
        type: string
        default: 'input test case name'
      question:
        description: 'Cau hoi muon hoi Claude'
        required: false
        type: string
        default: 'ask me here'

jobs:
  report:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install dependencies
        run: npm install

      - name: install playwright browsers (linux)
        if: runner.os == 'Linux'
        run: npx playwright install chromium --with-deps

      - name: install playwright browsers (non-linux)
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: run tests and save results
        env:
          TESTCASE: ${{ inputs.testcase }}
        run: |
          if [ -n "$TESTCASE" ]; then
            ESCAPED=$(printf '%s' "$TESTCASE" | sed -e 's/[][\.^$*+?(){}|]/\\&/g')
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results-report.json npx playwright test -g "$ESCAPED" --reporter=json || true
          else
            PLAYWRIGHT_JSON_OUTPUT_NAME=test-results-report.json npx playwright test --reporter=json || true
          fi

      - name: install claude code cli
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          npm install -g @anthropic-ai/claude-code

      - name: add npm global bin to path (windows)
        if: runner.os == 'Windows'
        run: echo "$HOME/.npm-global" >> "$GITHUB_PATH"

      - name: add npm global bin to path (non-windows)
        if: runner.os != 'Windows'
        run: echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      - name: trust workspace for claude cli
        run: |
          mkdir -p "$HOME/.claude"
          node -e "
            const fs = require('fs');
            const path = require('path');
            const file = path.join(require('os').homedir(), '.claude.json');
            let data = {};
            if (fs.existsSync(file)) {
              data = JSON.parse(fs.readFileSync(file, 'utf8'));
            }
            data.projects = data.projects || {};
            const ws = process.env.GITHUB_WORKSPACE;
            data.projects[ws] = data.projects[ws] || {};
            data.projects[ws].hasTrustDialogAccepted = true;
            fs.writeFileSync(file, JSON.stringify(data, null, 2));
          "

      - name: ask claude for test case report
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TESTCASE: ${{ inputs.testcase }}
          QUESTION: ${{ inputs.question }}
        run: |
          PROMPT="$QUESTION Doc file test-results-report.json (ket qua that vua chay Playwright, khong phai doan) de lay so lieu chinh xac: tong so test case da chay, ten tung test case, va pass/fail."
          if [ -n "$TESTCASE" ]; then
            PROMPT="$PROMPT Tap trung phan tich rieng test case co ten: \"$TESTCASE\"."
          fi
          claude -p "$PROMPT" --allowedTools "Bash(find:*)" "Bash(ls:*)" "Bash(cat:*)" "Glob" "Grep" "Read"
