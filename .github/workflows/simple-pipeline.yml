name: Simple Self-Hosted Pipeline

on:
  workflow_dispatch:

jobs:
  firstsetupGit:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print runner info
        run: |
          echo "Dang chay tren self-hosted runner!"
          echo "Hostname: $(hostname)"
          echo "Kien truc: $(uname -m)"
          echo "Ngay gio: $(date)"

      - name: List repo files
        run: ls -la
