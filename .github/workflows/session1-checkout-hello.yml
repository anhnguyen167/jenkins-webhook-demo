name: Session1 Checkout Hello

on:
  workflow_dispatch:

jobs:
  pipelineSession1:
    runs-on: self-hosted
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: print checkout info
        run: |
          echo "Commit: ${GITHUB_SHA}"
          echo "Branch: ${GITHUB_REF_NAME}"

      - name: hello
        run: |
          echo "Hello World"
          echo "Job: ${GITHUB_WORKFLOW}  Run: #${GITHUB_RUN_NUMBER}  Branch: ${GITHUB_REF_NAME}"
