name: Session6 Flow3 Run Tests

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    # Loc o cap trigger (khong phai o cap job) - chi Flow2 tao file .spec.ts, Flow1 chi tao
    # specs/*.md nen se khong bao gio khop path nay. Nho vay PR cua Flow1 se KHONG tao ra
    # workflow run "Action required" o day nua (truoc day loc bang if: o job, nhung GitHub
    # da tao run + doi approve TRUOC KHI kip danh gia if:, gay nham lan PR nao cung bi hoi).
    paths:
      - 'tests/**/*.spec.ts'

jobs:
  run-generated-tests:
    # Chay ngay khi PR cua Flow2 (chua test automation, nhanh ten testgen/*-flow2) duoc mo/cap nhat,
    # khong can doi merge - ket qua duoc comment thang vao PR truoc khi ai do bam merge.
    if: startsWith(github.event.pull_request.head.ref, 'testgen/') && endsWith(github.event.pull_request.head.ref, '-flow2')
    runs-on: self-hosted
    permissions:
      pull-requests: write
    steps:
      - name: checkout pr head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: determine changed spec files
        id: files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.spec.ts' | tr '\n' ' ')
          if [ -z "$FILES" ]; then
            echo "Khong tim thay file .spec.ts nao trong PR nay, dung lai"
            exit 1
          fi
          echo "Se chay: $FILES"
          echo "spec_files=$FILES" >> "$GITHUB_OUTPUT"

      - name: install dependencies
        run: npm install

      - name: install playwright browsers (linux)
        if: runner.os == 'Linux'
        run: npx playwright install chromium --with-deps

      - name: install playwright browsers (non-linux)
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: run generated test cases
        id: run
        env:
          SPEC_FILES: ${{ steps.files.outputs.spec_files }}
        run: |
          set +e
          PLAYWRIGHT_JSON_OUTPUT_NAME=test-results-flow3.json npx playwright test $SPEC_FILES --reporter=json,line
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow3-test-results-${{ github.event.pull_request.number }}
          path: test-results-flow3.json
          if-no-files-found: ignore

      - name: comment result on pr
        if: always()
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXIT_CODE: ${{ steps.run.outputs.exit_code }}
          SPEC_FILES: ${{ steps.files.outputs.spec_files }}
        with:
          script: |
            const fs = require('fs');
            const { PR_NUMBER, EXIT_CODE, SPEC_FILES } = process.env;
            const status = EXIT_CODE === '0' ? 'PASS' : 'FAIL';

            const lines = [];
            function walk(suite) {
              for (const spec of suite.specs || []) {
                const last = spec.tests?.[0]?.results?.slice(-1)[0];
                const st = last ? last.status : 'unknown';
                const icon = st === 'passed' ? '✅' : st === 'skipped' ? '⚠️' : '❌';
                lines.push(`${icon} ${spec.title} — ${st}`);
              }
              for (const child of suite.suites || []) walk(child);
            }
            let details = '(khong doc duoc chi tiet tung test case)';
            try {
              const report = JSON.parse(fs.readFileSync('test-results-flow3.json', 'utf8'));
              for (const suite of report.suites || []) walk(suite);
              if (lines.length > 0) details = lines.join('\n');
            } catch (e) {
              details = `(loi doc file ket qua: ${e.message})`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(PR_NUMBER),
              body: `Flow3: da chay test automation cua PR nay (chua merge).\n\nFile da chay: ${SPEC_FILES}\nKet qua tong: ${status}\n\n${details}\n\nXem log day du trong workflow run va artifact test-results-flow3.json.`
            })
